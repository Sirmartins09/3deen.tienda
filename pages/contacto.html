<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <!-- CONTACTO -->
<main id="contacto">
  <h2>Contacto</h2>
  <section class="contacto">
    <div class="info">
      <h3>Estamos para ayudarte</h3>
      <p>Si tenés dudas sobre productos, pedidos o cualquier consulta, completá el formulario y nos pondremos en contacto.</p>
      <p><strong>Teléfono:</strong> +54 2615632792</p>
      <p><strong>Email:</strong> martindn6@gmail.com</p>
    </div>

    <form class="formulario">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="tuemail@email.com">

      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Escribe tu consulta..."></textarea>

      <button type="submit" class="btn">Enviar</button>
    </form>
  </section>
</main>

</body>
</html>
